name: Compiler l'application TBSA

# Se lance toute seule a chaque depot de fichiers, ou a la demande (onglet Actions > Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'application
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparer le fichier TBSA-Serveur.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk TBSA-Serveur.apk

      - name: Garder le fichier (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: TBSA-Serveur-apk
          path: TBSA-Serveur.apk

      - name: Publier le fichier (lien de telechargement direct dans Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Application TBSA (derniere version)
          body: |
            Telechargez le fichier TBSA-Serveur.apk ci-dessous, puis installez-le sur votre stick TV
            (voir LISEZMOI-STICK.txt).
          files: TBSA-Serveur.apk
          make_latest: true
